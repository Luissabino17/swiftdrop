<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | SwiftDrop</title>
  <link rel="stylesheet" href="style8.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">
        <img src="swiftdroplogo.png" alt="SwiftDrop Logo">
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="productdescription.html">New Delivery</a></li>
        <li><a href="tracking.html">Track Shipment</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <div class="contact-container">
    <h1>Contact SwiftDrop</h1>
    <div class="contact-grid">
      <div class="contact-info">
        <h2>Customer Support</h2>
        <p><strong>Email:</strong> support@swiftdrop.com</p>
        <p><strong>Phone:</strong> 1-800-SWIFT-DROP</p>
        <p><strong>Hours:</strong> Mon-Fri, 8AM-8PM EST</p>
        
        <h2>Corporate Office</h2>
        <address>
          123 Logistics Way<br>
          New York, NY 10001<br>
          United States
        </address>
      </div>
      
      <form class="contact-form">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" required></textarea>
        </div>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2023 SwiftDrop Logistics. All rights reserved.</p>
  </footer>
</body>
</html>
